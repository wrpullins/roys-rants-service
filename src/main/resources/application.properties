spring.application.name=roys-rants-service

# MySQL Database Configuration #

## --- MySQL Database Configuration ---

spring.datasource.url=jdbc:mysql://roys-rants.ca52yssekuy9.us-east-1.rds.amazonaws.com:3306/roys_rants?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=5

# Hibernate / JPA Settings #

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Spring Security User #

spring.security.user.name=${APP_ADMIN_USERNAME}
spring.security.user.password=${APP_ADMIN_PASSWORD}
spring.security.user.roles=ADMIN

# JWT Configuration #

spring.security.jwt.secret=${JWT_SECRET}

roys.rants.counters=on